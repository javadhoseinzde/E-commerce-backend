version: "3.8"

services:
  backend:
    build: .
    container_name: ecommerce-backend
    working_dir: /app/src
    expose:
      - "8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=1

  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend